name: Feature request
description: Something v-park should do and does not
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve
      description: |
        The problem, not the solution. "Players lose their car when they crash out" is a
        problem; "add a reconnect grace period" is a solution, and there may be a better one.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you think it should do
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What you tried instead
      description: |
        Including config settings that were close but not right. If a setting nearly does this,
        say which - widening it is usually better than adding a second one.

  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: I have read CONFIG.md and this is not already configurable
          required: true
        - label: This belongs in a persistence resource rather than in a garage or a HUD
          required: true
